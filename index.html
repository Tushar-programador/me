<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Backend and Cloud/DevOps engineer with 2+ years of experience building production APIs and cloud infrastructure with Go, Node.js, AWS, Docker, Kubernetes and Terraform.">

<script>document.documentElement.classList.add('js')</script>
<style>
:root{--bg:#0a1424;--bg-2:#0f1d35;--line:#1d3252;--text:#e6edf7;--muted:#92a6c2;--cyan:#35d0e8;--amber:#f5b041;--radius:10px;--sans:'Space Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--gutter:clamp(16px,5vw,48px);--max:1120px}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background-color:var(--bg);background-image:linear-gradient(rgba(53,208,232,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(53,208,232,.045) 1px,transparent 1px);background-size:48px 48px;color:var(--text);font:400 1rem/1.65 var(--sans);overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:4px}
.skip{position:absolute;left:var(--gutter);top:-60px;background:var(--cyan);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:100;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.nav{position:sticky;top:0;z-index:50;background:rgba(10,20,36,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav nav{max-width:var(--max);margin:0 auto;padding:10px var(--gutter);display:flex;align-items:center;gap:24px}
.brand{font:700 1.15rem var(--mono);text-decoration:none;letter-spacing:-.02em}
.brand span{color:var(--cyan)}
.nav ul{list-style:none;padding:0;display:flex;gap:22px;margin-left:auto}
.nav ul a{font:500 .78rem var(--mono);color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:.08em}
.nav ul a:hover{color:var(--text)}
@media(max-width:720px){.nav ul{display:none}.nav .btn{margin-left:auto}}
.btn{display:inline-block;background:var(--cyan);color:var(--bg);font:700 .9rem var(--sans);padding:12px 22px;border-radius:8px;text-decoration:none;border:1px solid var(--cyan);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(53,208,232,.3)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--cyan);box-shadow:none}
.btn.sm{padding:7px 14px;font-size:.78rem}
section{padding:clamp(64px,10vw,112px) var(--gutter)}
.wrap{max-width:var(--max);margin:0 auto}
.eyebrow{font:500 .75rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:12px}
h1,h2,h3{line-height:1.12;letter-spacing:-.02em}
h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:36px}
footer{border-top:1px solid var(--line);padding:32px var(--gutter);color:var(--muted);font:400 .85rem var(--mono);text-align:center}
html.js .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
html.js .reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  html.js .reveal{opacity:1;transform:none}
}
/* @css-end */
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav">
  <nav aria-label="Primary">
    <a class="brand" href="#hero">TK<span>.</span></a>
    <ul>
      <li><a href="#about">About</a></li>
      <li><a href="#experience">Experience</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
    <a class="btn sm" href="Tushar_Kalra_Resume.pdf" download>Resume ↓</a>
  </nav>
</header>
<main id="main">

</main>
<footer>© 2026 Tushar Kalra · Backend &amp; Cloud Engineer</footer>
<script>
(function(){
  var els=[].slice.call(document.querySelectorAll('.reveal'));
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return}
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}});
  },{threshold:.12});
  els.forEach(function(e){io.observe(e)});
})();
// @js-end
</script>
</body>
</html>
